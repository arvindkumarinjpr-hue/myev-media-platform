name: myev-media

# Module 1A scope. Per the approved plan and acceptance checklist:
#   - PostgreSQL, Redis, and MinIO expose NO host ports — internal Docker
#     network only. Nothing here binds them publicly, even for "convenience".
#   - web/api host ports are chosen to avoid colliding with the other
#     project stack already running locally on 3000/3001/5432/6379.
#   - worker is scaffolded with zero BullMQ job processors (Module 1A scope
#     per plan point 8) — it only proves it can start and reach Redis.
#   - Mailpit/MailHog is intentionally NOT included yet: nothing in Module 1A
#     sends email. It is added in Module 1B when password reset needs it —
#     not included here to avoid expanding 1A's scope.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: myev
      POSTGRES_PASSWORD: myev_dev_password
      POSTGRES_DB: myev_media
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - myev-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myev -d myev_media"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No `ports:` — not reachable from the host. Verified in the acceptance checklist.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - myev-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No `ports:` — not reachable from the host.

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: myev_minio_admin
      MINIO_ROOT_PASSWORD: myev_minio_dev_password
    volumes:
      - minio-data:/data
    networks:
      - myev-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No `ports:` — not reachable from the host, including the MinIO console.

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      LOG_LEVEL: info
      DATABASE_URL: postgresql://myev:myev_dev_password@postgres:5432/myev_media?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: minio
      STORAGE_PORT: "9000"
      STORAGE_USE_SSL: "false"
      STORAGE_ACCESS_KEY: myev_minio_admin
      STORAGE_SECRET_KEY: myev_minio_dev_password
      STORAGE_BUCKET: myev-media-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      # Host port intentionally non-default (avoids the 3000/3001 already in
      # use by another local project stack). Not the port CloudPanel will use
      # in production — that awaits the VPS port audit per the approved plan.
      - "3200:4000"
    networks:
      - myev-internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      - api
    ports:
      - "3100:3000"
    networks:
      - myev-internal

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - myev-internal
    # No `ports:` — the worker has no HTTP surface in Module 1A.

networks:
  myev-internal:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
