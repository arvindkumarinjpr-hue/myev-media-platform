name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    # Module 1F Phase A hardening: a fast-fail backstop only, not a fix for
    # slow tests — the observed healthy baseline for this job is ~1.5
    # minutes; this gives ~6x margin before treating it as genuinely hung
    # rather than merely slow.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify internal workspace packages import cleanly at runtime
        run: pnpm verify:packages

  docker-validate:
    name: Docker Compose Config, Build & Remotion Smoke
    runs-on: ubuntu-latest
    # Module 7 Phase 7.5: the render-worker image (Debian + Chrome
    # Headless Shell) + the real Remotion smoke render add ~8-10 minutes
    # over the prior ~2.5-minute baseline.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker compose config
        run: docker compose -f docker/docker-compose.yml config

      - name: Build all service images
        run: docker compose -f docker/docker-compose.yml build

      # Module 7 Phase 7.7 staging deployment discovered that neither the
      # general worker's nor the render-worker's RUNTIME image had ever
      # actually been booted end-to-end in CI: the E2E job runs both via
      # `ts-node` against source, and the Remotion smoke below runs the
      # render engine directly, not through NestJS/dist/main.js. The
      # runtime image's `pnpm deploy --legacy` output turned out to break
      # @myev/worker-core's PrismaService at boot (MODULE_NOT_FOUND) —
      # invisible until a real `docker run` of the compiled image, which
      # staging deployment is the first thing to do. Catch that class of
      # regression here: actually start both runtime images against the
      # compose stack's real Postgres/Redis and require a live heartbeat
      # row for each — not just "the container didn't exit immediately".
      - name: Boot worker + render-worker runtime images against a real migrated DB (catches image-only startup regressions)
        run: |
          docker compose -f docker/docker-compose.yml up -d postgres redis minio
          # Migrate with the api image's own `build` stage (has the prisma
          # CLI; the runtime image deliberately doesn't) — same technique
          # verified against the real Module 7 Phase 7.7 staging DB.
          docker build --target build -f apps/api/Dockerfile -t ci-migrate:tmp .
          docker run --rm --network myev-media_myev-internal \
            -e DATABASE_URL=postgresql://myev:myev_dev_password@postgres:5432/myev_media?schema=public \
            ci-migrate:tmp npx prisma migrate deploy
          docker compose -f docker/docker-compose.yml up -d worker render-worker
          for svc in worker render-worker; do
            for i in $(seq 1 60); do
              cid=$(docker compose -f docker/docker-compose.yml ps -q "$svc")
              status=$(docker inspect -f '{{.State.Status}}' "$cid" 2>/dev/null || echo "unknown")
              if [ "$status" != "running" ]; then
                echo "$svc is not running (status=$status) at ${i}s — startup failed" >&2
                docker logs "$cid" 2>&1 | tail -60
                exit 1
              fi
              restarts=$(docker inspect -f '{{.RestartCount}}' "$cid" 2>/dev/null || echo 0)
              if [ "$restarts" -gt 0 ]; then
                echo "$svc has restarted $restarts time(s) at ${i}s — crash loop" >&2
                docker logs "$cid" 2>&1 | tail -60
                exit 1
              fi
              sleep 1
            done
            echo "$svc: running, no restarts after 60s — OK"
          done
          docker compose -f docker/docker-compose.yml down

      # Section §F/§G — the REAL production render path, proven inside the
      # dedicated render-worker image (Chromium + fonts + bundled FFmpeg).
      # Reuses the `build` layers cached by the compose build above; only
      # the apt libs + Chrome download + the render itself are new work.
      # A production rendering path that has never run cannot be approved.
      - name: Remotion production render smoke (in render-worker image)
        run: docker build --target smoke -f apps/render-worker/Dockerfile -t myev-render-smoke .

  e2e:
    name: E2E Tests (Postgres + Redis + Mailpit + MinIO)
    runs-on: ubuntu-latest
    # Module 1F Phase A hardening: fast-fail backstop only, not a fix for
    # slow tests and not something later steps should be tuned against.
    # The observed healthy baseline for this whole job (setup + Worker E2E
    # + API E2E) is ~7-8 minutes; this gives roughly 3x margin before
    # treating the job as genuinely hung rather than merely slow — chosen
    # deliberately looser than the other two jobs' margin, since this one's
    # own step durations are the least deterministic of the three.
    timeout-minutes: 32
    # GitHub-hosted service containers — ephemeral, per-job, torn down when
    # the job ends. Exposing their ports to the runner's localhost here is
    # not a departure from the "zero host-port exposure" rule in
    # docker/docker-compose.yml — that rule is about a developer's real
    # machine / the production Docker Compose stack, not a disposable CI
    # runner with no other tenants.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: myev
          POSTGRES_PASSWORD: myev_ci_password
          POSTGRES_DB: myev_media_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myev -d myev_media_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget -qO- http://localhost:8025/livez || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # No `minio` entry here: unlike every other service above, the
    # minio/minio image has no usable default command (it exits 0
    # immediately printing --help unless given `server /data` explicitly),
    # and GitHub Actions' declarative `services:` block has no field to
    # override a service container's command. MinIO is started as a plain
    # `docker run` step below instead — see "Start MinIO".
    env:
      DATABASE_URL: postgresql://myev:myev_ci_password@localhost:5432/myev_media_test?schema=public
      REDIS_URL: redis://localhost:6379
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_FROM_ADDRESS: no-reply@myevmedia.com
      # e2e-app.ts's getLatestEmailFor() defaults to the Docker-Compose
      # hostname "mailpit", which doesn't resolve on a GitHub-hosted
      # runner — service containers are reached via localhost instead.
      MAILPIT_API_URL: http://localhost:8025
      APP_URL: http://localhost:3100
      JWT_ACCESS_SECRET: ci-only-jwt-secret-do-not-use-elsewhere
      NODE_ENV: development
      PORT: "4000"
      LOG_LEVEL: error
      # Module 1C: the single Platform Owner can only be created via the
      # seed script (no HTTP endpoint) — the e2e helper loginAsPlatformOwner()
      # reads these same two vars to log in as whatever the seed step below
      # just created.
      BOOTSTRAP_OWNER_EMAIL: owner@myevmedia.com
      BOOTSTRAP_OWNER_PASSWORD: ci-only-owner-password-do-not-use-elsewhere-123
      # Module 9 Phase 9.1: PublishingCredentialCryptoService's AES-256-GCM
      # master key — a fixed, 64-hex-char CI-only value (never a real
      # secret). Phase 9.1's own e2e suite never exercised the real crypto
      # service (its fixtures wrote raw placeholder ciphertext directly),
      # so this gap went unnoticed until Phase 9.2's e2e suite started
      # calling PublishingCredentialCryptoService.encrypt() for real.
      PUBLISHING_CREDENTIAL_ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
      # Module 1D: MinIO started via the "Start MinIO" step below (see the
      # comment above `services:` for why it isn't a service container).
      STORAGE_ENDPOINT: localhost
      STORAGE_PORT: "9000"
      STORAGE_USE_SSL: "false"
      STORAGE_ACCESS_KEY: myev_minio_admin
      STORAGE_SECRET_KEY: myev_minio_dev_password
      STORAGE_BUCKET: myev-media-test
      # Module 1F: apps/worker's own e2e suite runs in this same job
      # (shares the Postgres/Redis service containers above).
      # Module 3 Phase 3.3: AI added so the same background Worker started
      # below also executes ai.execute.v1 jobs during the API E2E suite.
      WORKER_QUEUES: SYSTEM,AI
      WORKER_APPLICATION_VERSION: ci-e2e
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # apps/worker's own e2e suite (ts-jest) requires @myev/shared's
      # COMPILED dist output, not its raw TS source: its package.json
      # main/types point at ./dist, and Node's native TS type-stripping
      # refuses to run on a dependency required from inside
      # node_modules — apps/worker/Dockerfile's own "build" stage
      # already does this same step before compiling apps/worker for
      # exactly this reason. The "Lint, Typecheck, Test, Build" job
      # above runs a full `pnpm build`, but that happens on a separate,
      # ephemeral runner whose artifacts don't carry over to this job.
      - name: Build shared packages (@myev/shared, @myev/worker-core)
        run: |
          pnpm --filter @myev/shared build
          pnpm --filter @myev/worker-core build

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=myev_minio_admin \
            -e MINIO_ROOT_PASSWORD=myev_minio_dev_password \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -fs http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO is healthy."
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become healthy in time." >&2
          docker logs minio
          exit 1

      - name: Apply database migrations
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy

      - name: Seed RBAC catalog and Platform Owner
        working-directory: apps/api
        run: pnpm exec ts-node --transpile-only prisma/seed.ts

      # Runs first, and alone: it boots its own self-contained Worker
      # instance internally (Test.createTestingModule). Running it
      # concurrently with the standalone background Worker started below
      # would put two competing consumers on the same SYSTEM queue —
      # exactly the race that made this suite flaky in local verification
      # (whichever instance BullMQ dispatches a given job to "wins",
      # non-deterministically, and the loser's assertions fail).
      - name: Run Worker E2E suite (general SYSTEM/AI worker)
        working-directory: apps/worker
        run: pnpm test:e2e

      # The dedicated render/media worker's own e2e — the four MEDIA
      # processors (image/tts/subtitle/video-render) against real
      # Postgres + MinIO with the deterministic render engine. Runs here,
      # before the standalone background workers start, for the same
      # two-consumer-race reason.
      - name: Run Render-Worker E2E suite (dedicated MEDIA worker)
        working-directory: apps/render-worker
        run: pnpm test:e2e

      # apps/api's own e2e suite (background-jobs.e2e-spec.ts, Module 1F)
      # enqueues real jobs and waits for a real Worker to complete them —
      # nothing else in this job runs one, unlike a developer's local
      # Docker Compose stack where apps/worker is always already running.
      # Backgrounded + disowned so it survives past this step's own shell;
      # torn down for free when the runner is destroyed at job end. Started
      # only now (after the Worker E2E suite above has already finished)
      # to avoid the two-consumer race described there.
      - name: Start Worker (background)
        working-directory: apps/worker
        run: |
          # Root-caused (see CI WORKER BOOTSTRAP STALL — FINAL ROOT CAUSE
          # REPORT): the worker was never hung — main.ts's own
          # createApplicationContext() consistently resolves in ~130ms on
          # this exact runner, proven via temporary lifecycle-timestamp
          # instrumentation (added and fully reverted, see commits
          # fa027e9 / 1bc247c). The previous readiness probe
          # (`grep "BullMQ worker listening" /tmp/worker.log`) could never
          # succeed for an unrelated reason: that message is logged at
          # info level, and this job sets LOG_LEVEL=error — pino silently
          # drops it before a single byte is ever written, regardless of
          # bufferLogs/flushLogs timing. The fix is not to change
          # LOG_LEVEL (that's a deliberate, job-wide noise-reduction
          # setting unrelated to worker readiness) but to stop depending
          # on log output at all.
          #
          # WorkerHeartbeatService.onApplicationBootstrap() performs one
          # unconditional, un-gated database write (a worker_heartbeats
          # upsert) before this step's own polling loop could ever run —
          # a DB row, not a log line, so it exists regardless of log
          # level. Waiting for that row is a direct, deterministic proof
          # that Postgres connectivity works AND that bootstrap has
          # already progressed past the heartbeat provider — which, per
          # the same proven lifecycle order, runs before
          # BullMqWorkerManager and SchedulerTickManager, so its presence
          # is a reliable (if slightly conservative) proxy for "the
          # worker is operational."
          # Second-level precision only — deliberately not using a
          # sub-second format specifier (e.g. GNU date's %N): that's a
          # GNU coreutils extension, not universally portable, and
          # unnecessary here — CI steps run strictly sequentially with
          # clear multi-second separation, so second resolution is
          # already more than enough to distinguish this attempt's own
          # heartbeat row from any earlier step's leftover rows.
          START_TIME_ISO=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          # The general worker — SYSTEM + AI only. The MEDIA queue (media
          # generation + video render, incl. the golden-path render job)
          # is handled by the separate render-worker started in the next
          # step; this process has no media/render code path at all.
          WORKER_QUEUES=SYSTEM,AI \
          nohup pnpm exec ts-node --transpile-only src/main.ts > /tmp/worker.log 2>&1 &
          WORKER_PID=$!
          disown

          for i in $(seq 1 90); do
            # Fail fast if bootstrap itself crashed — no point waiting
            # out the rest of the budget for a process that's already
            # gone (main.ts's own bootstrap().catch() sets exitCode=1
            # and returns, which ends the whole process tree here).
            if ! kill -0 "$WORKER_PID" 2>/dev/null; then
              echo "Worker process (pid $WORKER_PID) exited before becoming ready." >&2
              break
            fi

            HEARTBEAT_COUNT=$(PGPASSWORD=myev_ci_password psql -h localhost -U myev -d myev_media_test -tAc \
              "SELECT count(*) FROM worker_heartbeats WHERE started_at >= '${START_TIME_ISO}'::timestamptz AND application_version = '${WORKER_APPLICATION_VERSION}';" 2>/dev/null)

            if [ "${HEARTBEAT_COUNT:-0}" -gt 0 ] 2>/dev/null; then
              echo "Worker heartbeat confirmed after ${i}s (started_at >= ${START_TIME_ISO})."
              exit 0
            fi
            sleep 1
          done

          echo "Worker heartbeat not observed within the deadline." >&2
          echo "--- process alive? ---" >&2
          if kill -0 "$WORKER_PID" 2>/dev/null; then
            ps -p "$WORKER_PID" -o pid,ppid,stat,%cpu,etime,cmd >&2 || true
          else
            echo "process $WORKER_PID is not running" >&2
          fi
          echo "--- full process tree ---" >&2
          ps -e -o pid,ppid,stat,%cpu,etime,cmd --forest >&2 || true
          echo "--- /tmp/worker.log ---" >&2
          cat /tmp/worker.log
          echo "--- worker_heartbeats rows started since this step began (any application_version) ---" >&2
          PGPASSWORD=myev_ci_password psql -h localhost -U myev -d myev_media_test -c \
            "SELECT worker_id, hostname, process_id, application_version, queue_assignments, started_at, last_heartbeat_at FROM worker_heartbeats WHERE started_at >= '${START_TIME_ISO}'::timestamptz ORDER BY started_at DESC;" >&2 2>&1 || true
          exit 1

      # Module 7 Phase 7.5 — the dedicated render/media worker, consuming
      # the MEDIA queue, so the API E2E golden path exercises a real
      # HTTP -> BullMQ -> render-worker -> VIDEO MediaAsset flow.
      # RENDER_ENGINE=deterministic-test (no Chromium in this CI job — the
      # REAL Remotion render is proven by the render-worker-smoke job).
      - name: Start Render Worker (background)
        working-directory: apps/render-worker
        run: |
          START_TIME_ISO=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          WORKER_QUEUES=MEDIA RENDER_ENGINE=deterministic-test \
          nohup pnpm exec ts-node --transpile-only src/main.ts > /tmp/render-worker.log 2>&1 &
          RW_PID=$!
          disown
          for i in $(seq 1 90); do
            if ! kill -0 "$RW_PID" 2>/dev/null; then
              echo "Render-worker process (pid $RW_PID) exited before becoming ready." >&2
              break
            fi
            HB=$(PGPASSWORD=myev_ci_password psql -h localhost -U myev -d myev_media_test -tAc \
              "SELECT count(*) FROM worker_heartbeats WHERE started_at >= '${START_TIME_ISO}'::timestamptz AND queue_assignments::text LIKE '%MEDIA%';" 2>/dev/null)
            if [ "${HB:-0}" -gt 0 ] 2>/dev/null; then
              echo "Render-worker heartbeat confirmed after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "Render-worker heartbeat not observed within the deadline." >&2
          cat /tmp/render-worker.log
          exit 1

      - name: Run E2E suite
        working-directory: apps/api
        run: pnpm test:e2e

      - name: Show backgrounded worker logs (always, for debugging)
        if: always()
        run: |
          echo "=== /tmp/worker.log ==="; cat /tmp/worker.log || true
          echo "=== /tmp/render-worker.log ==="; cat /tmp/render-worker.log || true
