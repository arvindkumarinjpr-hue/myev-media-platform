name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  docker-validate:
    name: Docker Compose Config & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker compose config
        run: docker compose -f docker/docker-compose.yml config

      - name: Build all service images
        run: docker compose -f docker/docker-compose.yml build

  e2e:
    name: E2E Tests (Postgres + Redis + Mailpit)
    runs-on: ubuntu-latest
    # GitHub-hosted service containers — ephemeral, per-job, torn down when
    # the job ends. Exposing their ports to the runner's localhost here is
    # not a departure from the "zero host-port exposure" rule in
    # docker/docker-compose.yml — that rule is about a developer's real
    # machine / the production Docker Compose stack, not a disposable CI
    # runner with no other tenants.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: myev
          POSTGRES_PASSWORD: myev_ci_password
          POSTGRES_DB: myev_media_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myev -d myev_media_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget -qO- http://localhost:8025/livez || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://myev:myev_ci_password@localhost:5432/myev_media_test?schema=public
      REDIS_URL: redis://localhost:6379
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_FROM_ADDRESS: no-reply@myevmedia.com
      APP_URL: http://localhost:3100
      JWT_ACCESS_SECRET: ci-only-jwt-secret-do-not-use-elsewhere
      NODE_ENV: development
      PORT: "4000"
      LOG_LEVEL: error
      # No MinIO service container in CI — nothing in Module 1B.1's scope
      # (auth-only) touches storage. /health/ready degrades gracefully
      # (reports storage: "down", still returns a response) rather than
      # crashing, so this is a deliberate, harmless gap, not an oversight.
      STORAGE_ENDPOINT: localhost
      STORAGE_PORT: "9000"
      STORAGE_USE_SSL: "false"
      STORAGE_ACCESS_KEY: myev_minio_admin
      STORAGE_SECRET_KEY: myev_minio_dev_password
      STORAGE_BUCKET: myev-media-test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy

      - name: Run E2E suite
        working-directory: apps/api
        run: pnpm test:e2e
