packages:
  - "apps/*"
  - "packages/*"
overrides:
  # Module 1A.1 hardening: force the single patched sharp resolution —
  # without this, Next.js's own optional dependency on sharp pulls in the
  # vulnerable 0.34.x line alongside our explicit 0.35.3 pin.
  sharp: ^0.35.3
  # Module 1A.1 hardening: runtime-path transitive vulnerabilities, all
  # safe minor/patch bumps (verified non-breaking for how @nestjs/core
  # and @nestjs/platform-express consume them) — see the Hardening Report.
  multer: ^2.2.0
  lodash: ^4.17.24
  qs: ^6.15.2
  body-parser: ^1.20.6
  # Module 2 Phase 2.6: ts-jest's peer range accepts jest-util/@jest/types
  # ^29 or ^30 (apps/api, apps/worker, packages/shared all use jest@29.x).
  # Without pinning, adding apps/web's own jest-based test setup lets
  # pnpm's peer resolution drift ts-jest onto a 30.x jest-util/@jest/types
  # pairing that jest@29.7.0 itself doesn't recognize, breaking
  # "Module ts-jest in the transform option was not found" for every
  # other package's test script.
  jest-util: ^29.7.0
  "@jest/types": ^29.6.3
allowBuilds:
  argon2: true
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  sharp: true
  unrs-resolver: true
  # bullmq's optional native msgpack binding (Module 1F, apps/worker) —
  # same category as the other native addons above (prebuilt binary via
  # node-gyp-build, no arbitrary postinstall network/script behavior).
  msgpackr-extract: true
